mid_level_controller:
  # Pozisyon ve itki için PID kazançları
  kp_thrust_x: 1.0
  ki_thrust_x: 0.0
  kd_thrust_x: 0.2

  kp_thrust_y: 1.0
  ki_thrust_y: 0.0
  kd_thrust_y: 0.2

  kp_thrust_z: 4.5
  ki_thrust_z: 0.0
  kd_thrust_z: 2.0

  integral_min: 0.0
  integral_max: 0.5

  min_thrust: 0.0
  max_thrust: 15.905

  dt: 0.01            # Zaman adımı - 100 Hz döngü için (Düzeltildi)

  # --- Yeni Eklenen Bozulma Gözlemleyicisi (NDOB) Kazançları ---
  # Güvenli test için 0.0 ile başlıyoruz. Havada duruşunu gördükçe yavaş yavaş artırabilirsin.
  lv_x: 5.0           # X ekseni düzeltme hızı (Önerilen nominal değer: 2.0)
  lv_y: 5.0           # Y ekseni düzeltme hızı (Önerilen nominal değer: 2.0)
  lv_z: 8.0           # Z ekseni (Yükseklik) düzeltme hızı (Önerilen nominal değer: 2.5)
  
low_level_controller:
  # Dönme momentleri (Tork) için PID kazançları (Dokunulmadı, orijinal hali)
  kp_torque1: 0.02
  ki_torque1: 0.0
  kd_torque1: 0.01

  kp_torque2: 0.02
  ki_torque2: 0.0
  kd_torque2: 0.01

  kp_torque3: 0.02
  ki_torque3: 0.0
  kd_torque3: 0.01

  integral_min: 0.0
  integral_max: 0.01

  dt: 0.002           # Zaman adımı - 500 Hz döngü için (Düzeltildi)

state_derivative_solver_node:
  # Drone fiziksel parametreleri ve simülasyon ayarları
  mass: 0.382            # Drone kütlesi (kg)
  I: [0.00062, 0.0, 0.0, 0.0, 0.00062, 0.0, 0.0, 0.0, 0.00124] # Atalet matrisi
  g: [0.0, 0.0, -9.81] # Yerçekimi vektörü
  dt: 0.001           # Fizik motoru zaman adımı - 1000 Hz için (Düzeltildi)

  tau_thrust: 0.1
  tau_torque: 0.1

  rho: 1.225
  A_trans: [0.003, 0, 0, 0, 0.003, 0, 0, 0, 0.03]
  Cd_trans: [0.08, 0, 0, 0, 0.08, 0, 0, 0, 0.3]

  motor_k: 0.00000298  
  motor_b: 0.000000114 
  arm_length: 0.15